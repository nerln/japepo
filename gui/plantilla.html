/* ---------- temas ---------- */
:root {

  --acento-2: #8a6d1f;
  --barra: #b5451f;
  --banda: rgba(181, 69, 31, 0.18);

  --destacado: #8a6d1f;
  --marca-anillo: #b5451f;
  --marca-caldo: #efe4d3;

  --sombra: 0 1px 2px rgba(27, 23, 20, 0.06), 0 8px 24px rgba(27, 23, 20, 0.05);
  color-scheme: light;

  /* Tres radios, no uno. La ficha y las tablas van a canto vivo, las tarjetas
     apenas redondeadas, y solo las pastillas del control quedan circulares. */
  --radio: 6px;
  --radio-canto: 0px;
  --radio-pastilla: 999px;

  /* Tres familias, tres trabajos. Ninguna es la del sistema: un titular en

  --tipo-texto: "Japepo Serif", "Source Serif 4", Charter, Georgia, serif;
  --tipo-mono: "Japepo Mono", "Source Code", ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ---------- idioma ---------- */
html[lang="es"] [data-l="gn"], html[lang="gn"] [data-l="es"] { display: none; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font-family: var(--tipo-texto); font-size: 1.0625rem; font-weight: 400;
  line-height: 1.66; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.envoltura { max-width: 62rem; margin: 0 auto; padding: 0 1.25rem; }
.prosa { max-width: 62ch; }          /* la linea de lectura, no el ancho del bloque */

/* El salto de la pagina es de familia antes que de peso: geometrico de 700
   contra serif de 250. Un 400 contra un 600 de la misma familia es el contraste
   timido que hace que todo se parezca a todo. */
h1, h2, h3 { font-family: var(--tipo-display); font-weight: 700; }
h1 {
  font-size: clamp(2.4rem, 5.4vw, 3.8rem); line-height: 1.03;
  letter-spacing: -0.035em; margin: 0 0 .5rem;
}
h2 {
  font-size: clamp(1.6rem, 3.2vw, 2.25rem); line-height: 1.12;
  letter-spacing: -0.022em; margin: 0 0 .5rem;
}
h3 {
  font-size: 1.06rem; line-height: 1.3; letter-spacing: -0.008em;
  margin: 2.4rem 0 .6rem;
}
p { margin: 0 0 1.05rem; }
strong, b { font-weight: 600; }
a { color: var(--acento); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; border-radius: 3px; }
.silencio { color: var(--texto-2); }
.mono { font-family: var(--tipo-mono); font-variant-numeric: tabular-nums; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* El enlace de salto es el primer tabulado de la pagina: al recibir el foco
   tiene que verse, o para quien navega con teclado es como no tenerlo. */
.oculto:focus, .oculto:focus-visible {
  position: fixed; top: .6rem; left: .6rem; width: auto; height: auto; clip: auto;
  z-index: 60; background: var(--acento); color: var(--fondo);
  padding: .5rem .9rem; border-radius: var(--radio); font-family: var(--tipo-display);
  font-weight: 700; text-decoration: none;
}

/* ---------- barra de control ---------- */
/* Una linea de texto arriba de todo. No se pega al scroll: una barra que
   persigue al lector le come alto de pantalla en el telefono y no hace falta,
   porque el tema ya viene del sistema y el idioma se elige una vez. */
.control { border-bottom: 1px solid var(--borde); }
.control .envoltura {
  display: flex; gap: 1rem; align-items: baseline; justify-content: space-between;
  padding-top: .85rem; padding-bottom: .85rem;
}
.control-nombre {
  font-family: var(--tipo-display); font-weight: 700; font-size: .95rem;
  letter-spacing: -0.02em; color: var(--texto); text-decoration: none;
}
.control-derecha {
  display: flex; align-items: baseline; gap: 1.1rem;
  font-family: var(--tipo-display); font-weight: 500; font-size: .8rem;
}
.idiomas { display: flex; align-items: baseline; gap: .45rem; }
.idiomas > span[aria-hidden] { color: var(--borde-fuerte); }
.idiomas button {
  border: 0; background: none; padding: 0; margin: 0; font: inherit;
  color: var(--texto-2); cursor: pointer;
}
.idiomas button:hover { color: var(--acento); }
.idiomas button[aria-pressed="true"] { color: var(--texto); font-weight: 700; }
.temas { position: relative; display: inline-flex; align-items: baseline; }
.temas::after {
  content: "▾"; position: absolute; right: 0; pointer-events: none;
  color: var(--texto-2); font-size: .7em;
}
.temas select {
  appearance: none; -webkit-appearance: none;
  border: 0; background: none; font: inherit; color: var(--texto-2);
  padding: 0 .85rem 0 0; margin: 0; cursor: pointer;
}
.temas select:hover { color: var(--acento); }

/* ---------- portada ---------- */
.portada { padding: 3.2rem 0 2rem; border-bottom: 1px solid var(--borde); }
.portada-fila { display: flex; gap: 2.2rem; align-items: center; flex-wrap: wrap; }
.portada-fila > div { flex: 1 1 22rem; min-width: 0; }
.marca { width: 132px; height: 132px; flex: none; }
.control .marca { width: 26px; height: 26px; }
.bajada {
  font-size: clamp(1.15rem, 2.1vw, 1.45rem); font-weight: 250; line-height: 1.42;
  color: var(--texto); max-width: 40ch; margin: .3rem 0 1rem;
}
.hechos { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
.hecho {
  border: 1px solid var(--borde); background: var(--fondo-2); border-radius: var(--radio);
  padding: .3rem .7rem; font-family: var(--tipo-display); font-weight: 500; font-size: .8rem;
}
.hecho b { font-weight: 600; }

/* ---------- la proxima gala ---------- */
.cifras { display: flex; gap: 1.6rem; flex-wrap: wrap; margin-top: 1.4rem; }
.cifra {
  font-family: var(--tipo-display); font-weight: 500; font-size: .78rem;
  color: var(--texto-2); line-height: 1.2; text-transform: uppercase; letter-spacing: .08em;
}
.cifra-num {
  display: block; font-family: var(--tipo-display); font-weight: 700;
  font-size: 2rem; letter-spacing: -0.03em; color: var(--texto); text-transform: none;
}
.proxima-tarjeta {
  margin-top: 2.4rem; border: 1px solid var(--borde-fuerte); border-left: 4px solid var(--acento);
  background: var(--fondo-2); padding: 1.1rem 1.3rem; border-radius: var(--radio);
}
.proxima-rotulo {
  font-family: var(--tipo-display); font-weight: 700; font-size: .7rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--acento); margin: 0 0 .3rem;
}
.proxima-cuando {
  font-family: var(--tipo-display); font-weight: 700; letter-spacing: -0.02em;
  font-size: clamp(1.3rem, 2.6vw, 1.75rem); margin: 0; line-height: 1.2;
}
.proxima-hora {
  font-family: var(--tipo-mono); font-size: .8em; color: var(--acento); margin-left: .6rem;
}
.proxima-reloj { margin: .35rem 0 0; font-size: .95rem; color: var(--texto-2); min-height: 1.5em; }
.proxima-tarjeta .hechos { margin-top: .9rem; }
a.hecho { text-decoration: none; }
a.hecho:hover { border-color: var(--acento); }
.capitanes { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
.capitan {
  display: flex; align-items: center; gap: .45rem; border: 1px solid var(--borde);
  border-radius: var(--radio-pastilla); padding: .2rem .8rem .2rem .2rem;
  background: var(--fondo-2); font-family: var(--tipo-display); font-weight: 500; font-size: .85rem;
}
.capitan .cara { width: 30px; height: 30px; }
.calendario { list-style: none; padding: 0; margin: 1rem 0 0; max-width: 26rem; }
.calendario li {
  display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0;
  border-bottom: 1px solid var(--borde); font-family: var(--tipo-display); font-weight: 500;
  font-size: .9rem;
}
.calendario li:last-child { border-bottom: 0; }
.calendario .mono { color: var(--texto-2); font-size: .85rem; }

/* ---------- momentos ---------- */
.momentos-h {
  font-family: var(--tipo-display); font-weight: 700; font-size: .72rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--texto-2); margin: 1.4rem 0 .5rem;
}
.momentos { margin: 0; padding-left: 1.1rem; display: grid; gap: .45rem; }
.momentos li { padding-left: .3rem; }
.momentos li::marker { font-family: var(--tipo-mono); color: var(--acento); font-size: .85em; }

/* ---------- redes ---------- */
.cuentas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: .7rem; margin-top: 1rem; }
.cuenta {
  border: 1px solid var(--borde); background: var(--fondo-2); border-radius: var(--radio);
  padding: .7rem .9rem; text-decoration: none; color: var(--texto);
  font-family: var(--tipo-display); display: flex; flex-direction: column; gap: .15rem;
}
.cuenta:hover { border-color: var(--acento); }
.cuenta b { font-weight: 700; font-size: .95rem; }
.cuenta .mono { font-size: .8rem; color: var(--texto-2); }
.etiquetas-grandes { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
.etiqueta-grande {
  font-family: var(--tipo-display); font-weight: 700; font-size: .95rem;
  color: var(--acento); border: 1px solid var(--acento); border-radius: var(--radio-pastilla);
  padding: .2rem .85rem;
}

/* ---------- secciones ---------- */
section { padding: 3.2rem 0; border-bottom: 1px solid var(--borde); scroll-margin-top: 5.5rem; }
.rotulo {
  font-family: var(--tipo-mono); font-size: .8rem; letter-spacing: .1em;
  color: var(--acento); margin-bottom: .9rem;
}

/* ---------- ficha ---------- */
/* Las separaciones son sombras, no huecos: con seis datos y cuatro columnas
   sobra media fila, y un hueco pintado deja un bloque de color sin sentido. */
.ficha {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  background: var(--fondo-2); border: 1px solid var(--borde);
  border-radius: var(--radio-canto); overflow: hidden; margin-top: 1.75rem;
}
.ficha div { padding: .95rem 1.1rem; box-shadow: 1px 0 0 var(--borde), 0 1px 0 var(--borde); }
.ficha dt { font-family: var(--tipo-display); font-weight: 500; font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; color: var(--texto-2); margin-bottom: .25rem; }
.ficha dd { margin: 0; font-size: 1.02rem; }

/* ---------- medidor ---------- */
.medidor { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; margin: 1.5rem 0; }
.medidor svg { width: 128px; height: 128px; flex: none; }
.medidor-num {
  font-family: var(--tipo-texto); font-weight: 250; font-size: clamp(3.2rem, 7vw, 4.6rem);
  line-height: .95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}

/* ---------- barras ---------- */
.barras { margin: 1.5rem 0 0; display: grid; gap: .3rem; }
.barra-fila { display: grid; grid-template-columns: minmax(6rem, 9.5rem) 1fr 5.2rem; gap: .7rem; align-items: center; font-family: var(--tipo-display); font-weight: 500; font-size: .86rem; }
.barra-nombre { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pista { position: relative; height: 22px; background: var(--fondo-3); border-radius: 2px; overflow: hidden; }
.pista .banda {
  position: absolute; top: 0; bottom: 0; background: var(--banda);
  box-shadow: inset 2px 0 0 var(--texto-2), inset -2px 0 0 var(--texto-2);
  opacity: .85;
}
.pista .valor { position: absolute; top: 0; bottom: 0; left: 0; background: var(--barra); border-radius: 2px 0 0 2px; }
.pista .plano { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--plano); opacity: .75; }
.barra-num { font-family: var(--tipo-mono); font-size: .82rem; color: var(--texto-2); font-variant-numeric: tabular-nums; }
.leyenda { display: flex; gap: 1.2rem; flex-wrap: wrap; font-family: var(--tipo-display); font-weight: 500; font-size: .78rem; color: var(--texto-2); margin-top: 1rem; }
.leyenda i {
  display: inline-block; width: 14px; height: 10px; vertical-align: -1px;
  margin-right: .35rem; border-radius: 2px;
  box-shadow: inset 1px 0 0 var(--texto-2), inset -1px 0 0 var(--texto-2);
}

/* ---------- tablas ---------- */
.tabla-envoltura { overflow-x: auto; margin: 1.75rem 0; border: 1px solid var(--borde); border-radius: var(--radio-canto); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; background: var(--fondo-2); }
th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
th { font-family: var(--tipo-display); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-2); font-weight: 700; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--tipo-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.entero { white-space: nowrap; }

/* ---------- indice de secciones ---------- */
.indice { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.75rem; font-family: var(--tipo-display); font-weight: 500; font-size: .82rem; }
.indice { gap: .35rem 1.15rem; }
.indice a {
  text-decoration: none; color: var(--texto-2);
  border-bottom: 1px solid transparent; padding-bottom: 1px;
}
.indice a:hover { color: var(--acento); border-bottom-color: var(--acento); }
.numero-seccion { font-family: var(--tipo-mono); color: var(--texto-2); }

/* ---------- plantel ---------- */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: .9rem; margin-top: 1.5rem; }
.persona { border: 1px solid var(--borde); background: var(--fondo-2); border-radius: var(--radio); padding: .9rem; box-shadow: var(--sombra); }
.persona-cab { display: flex; gap: .7rem; align-items: center; }
.cara { width: 46px; height: 46px; flex: none; }
.persona-nombre { font-family: var(--tipo-display); font-weight: 700; font-size: .98rem; letter-spacing: -0.015em; line-height: 1.25; }
.persona-p { font-family: var(--tipo-mono); font-size: .82rem; color: var(--texto-2); }
.etiqueta { display: inline-block; font-family: var(--tipo-display); font-weight: 500; font-size: .7rem; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-pastilla); padding: .08rem .55rem; color: var(--texto-2); margin: .5rem .3rem 0 0; }
.etiqueta.viva { border-color: var(--destacado); color: var(--destacado); }
.persona-nota { font-size: .84rem; color: var(--texto-2); margin: .5rem 0 0; }

/* ---------- galas ---------- */
.gala { border-left: 3px solid var(--acento); padding: 0 0 1.5rem 1.2rem; margin-left: .4rem; position: relative; }
.gala:last-child { padding-bottom: 0; }
.gala.futura { border-left-style: dashed; border-left-color: var(--borde-fuerte); }
.gala h3 { margin-top: 0; }
.gala-meta { font-family: var(--tipo-display); font-weight: 500; font-size: .78rem; color: var(--texto-2); display: flex; gap: .8rem; flex-wrap: wrap; }
.podio { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
.podio span { border: 1px solid var(--borde); border-radius: var(--radio-pastilla); padding: .12rem .65rem; font-family: var(--tipo-display); font-weight: 500; font-size: .8rem; background: var(--fondo-2); }
.podio span.orden { border-color: var(--destacado); }

/* ---------- spoilers ---------- */
details.spoiler { border: 1px solid var(--borde-fuerte); border-radius: var(--radio); background: var(--fondo-2); padding: .9rem 1rem; margin-top: 1.5rem; }
details.spoiler > summary { cursor: pointer; font-family: var(--tipo-display); font-weight: 700; list-style: none; display: flex; align-items: center; gap: .5rem; }
details.spoiler > summary::-webkit-details-marker { display: none; }
details.spoiler > summary::before { content: "▸"; color: var(--acento); }
details.spoiler[open] > summary::before { content: "▾"; }
.aviso { border-left: 3px solid var(--acento); padding-left: .9rem; color: var(--texto-2); font-size: .9rem; margin: 1rem 0; }
.lista-limpia { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .7rem; }
.lista-limpia li { border: 1px solid var(--borde); border-radius: var(--radio); padding: .7rem .9rem; background: var(--fondo-2); }

/* ---------- tuits ---------- */
.tuits { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: .9rem; margin-top: 1.5rem; }
.tuit { border: 1px solid var(--borde); border-radius: var(--radio); background: var(--fondo-2); padding: .9rem; display: flex; flex-direction: column; gap: .6rem; }
.tuit-cab { display: flex; gap: .5rem; align-items: baseline; font-size: .82rem; }
.tuit-handle { font-family: var(--tipo-display); font-weight: 700; }
.tuit-texto { white-space: pre-line; font-size: .92rem; margin: 0; }
.tuit-pie { margin-top: auto; display: flex; gap: .8rem; align-items: center; font-size: .8rem; color: var(--texto-2); }

/* ---------- pie ---------- */
footer { padding: 2.5rem 0 4rem; font-size: .86rem; color: var(--texto-2); }
footer p { max-width: 42rem; }
.pie-enlaces { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (max-width: 34rem) {
  body { font-size: 16px; }
  .barra-fila { grid-template-columns: minmax(4.5rem, 7rem) 1fr 4.4rem; gap: .5rem; }
  .control-nombre { display: none; }
}
@media print {
  .control { display: none; }
  section { break-inside: avoid; }
}
</style>
</head>
<body>

<a class="oculto" href="#contenido">Ir al contenido</a>

<div class="control">
  <div class="envoltura">
    <a class="control-nombre" href="#contenido">japepo</a>
    <div class="control-derecha">
      <span class="idiomas">
        <span class="oculto" id="rot-idioma"><!--== ROTULO_IDIOMA_LLANO ==--></span>
        <button id="b-es" type="button" aria-pressed="true" lang="es"
                aria-describedby="rot-idioma"><!--== IDIOMA_ES ==--></button>
        <span aria-hidden="true">·</span>
        <button id="b-gn" type="button" aria-pressed="false" lang="gn"
                aria-describedby="rot-idioma"><!--== IDIOMA_GN ==--></button>
      </span>
      <span class="temas">
        <label class="oculto" for="s-tema-es" data-l="es"><!--== ROTULO_TEMA_ES ==--></label>
        <label class="oculto" for="s-tema-gn" data-l="gn"><!--== ROTULO_TEMA_GN ==--></label>
        <select id="s-tema-es" data-l="es"><!--== OPCIONES_TEMA_ES ==--></select>
        <select id="s-tema-gn" data-l="gn"><!--== OPCIONES_TEMA_GN ==--></select>
      </span>
    </div>
  </div>
</div>

<main id="contenido">
<!--== CUERPO ==-->
</main>

<footer>
  <div class="envoltura">
    <div class="pie-enlaces">
      <a href="https://github.com/nerln/japepo">nerln/japepo</a>
      <a href="https://github.com/nerln">nerln</a>
      <a href="https://x.com/nerellone">@nerellone</a>
    </div>
    <p><span data-l="es"><!--== PIE_AVISO_ES ==--></span><span data-l="gn"><!--== PIE_AVISO_GN ==--></span></p>
    <p><span data-l="es"><!--== PIE_GUARANI_ES ==--></span><span data-l="gn"><!--== PIE_GUARANI_GN ==--></span></p>
    <p><span data-l="es"><!--== PIE_TIPOS_ES ==--></span><span data-l="gn"><!--== PIE_TIPOS_GN ==--></span></p>
    <p class="mono"><!--== PIE_FIRMA ==--></p>
  </div>
</footer>

<script>
(function () {
  "use strict";
  var raiz = document.documentElement;
  var LLAVE_TEMA = "japepo:tema";
  var LLAVE_IDIOMA = "japepo:idioma";
  var LLAVE_SPOILER = "japepo:spoilers";
  var TEMAS = <!--== LISTA_TEMAS ==-->;

  function guardar(llave, valor) {
    try { localStorage.setItem(llave, valor); } catch (e) { /* modo privado */ }
  }
  function leer(llave) {
    try { return localStorage.getItem(llave); } catch (e) { return null; }
  }

  function ponerIdioma(codigo) {
    var valido = codigo === "gn" ? "gn" : "es";
    raiz.setAttribute("lang", valido);
    document.getElementById("b-es").setAttribute("aria-pressed", String(valido === "es"));
    document.getElementById("b-gn").setAttribute("aria-pressed", String(valido === "gn"));
    guardar(LLAVE_IDIOMA, valido);
  }

  function selectores() {
    return [document.getElementById("s-tema-es"), document.getElementById("s-tema-gn")];
  }

  var regla = null;
  function medir(s) {
    if (!regla) {
      regla = document.createElement("span");
      regla.setAttribute("aria-hidden", "true");
      regla.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
      document.body.appendChild(regla);
    }
    var estilo = getComputedStyle(s);
    regla.style.font = estilo.font;
    regla.style.letterSpacing = estilo.letterSpacing;
    regla.textContent = s.options[s.selectedIndex].text;
    return Math.ceil(regla.getBoundingClientRect().width);
  }

  function ponerTema(nombre) {
    var valido = TEMAS.indexOf(nombre) >= 0 ? nombre : "sistema";
    raiz.setAttribute("data-tema", valido);
    selectores().forEach(function (s) {
      s.value = valido;
      s.style.width = (medir(s) + 16) + "px";
    });
    guardar(LLAVE_TEMA, valido);
  }

  var parametros = new URLSearchParams(location.search);
  ponerIdioma(parametros.get("lang") || leer(LLAVE_IDIOMA) ||
              ((navigator.language || "es").slice(0, 2) === "gn" ? "gn" : "es"));
  ponerTema(parametros.get("tema") || leer(LLAVE_TEMA) || "sistema");

  document.getElementById("b-es").addEventListener("click", function () { ponerIdioma("es"); });
  document.getElementById("b-gn").addEventListener("click", function () { ponerIdioma("gn"); });
  selectores().forEach(function (s) {
    s.addEventListener("change", function (ev) { ponerTema(ev.target.value); });
  });

  // La cuenta regresiva. Las emisiones vienen del servidor en instantes UTC, asi
  // que da igual desde que huso se mire; la fecha y la hora ya estan escritas en
  // el HTML, y esto solo agrega cuanto falta.
  var EMISIONES = <!--== EMISIONES ==-->;

  function proximaEmision(ahora) {
    for (var i = 0; i < EMISIONES.length; i++) {
      var arranca = Date.parse(EMISIONES[i].iso);
      if (ahora < arranca + 90 * 60000) {
        return { arranca: arranca, alAire: ahora >= arranca, entrada: EMISIONES[i] };
      }
    }
    return null;
  }

  // La fecha tambien se reescribe, no solo el reloj. La que viene horneada en el
  // HTML es la del dia en que se construyo la pagina: si nadie la reconstruye,
  // el reloj sigue andando y la fecha se queda vieja, y la tarjeta pasa a decir
  // dos cosas distintas. Sin JavaScript se ve la horneada, que era cierta cuando
  // se publico.
  function pintarFecha(emision) {
    var fechas = document.querySelectorAll(".proxima-fecha");
    for (var i = 0; i < fechas.length; i++) {
      var idioma = fechas[i].getAttribute("data-l");
      if (emision && emision.entrada[idioma]) {
        fechas[i].textContent = emision.entrada[idioma];
      }
    }
  }

  function pintarReloj() {
    var relojes = document.querySelectorAll(".reloj");
    if (!relojes.length) { return; }
    var emision = proximaEmision(Date.now());
    pintarFecha(emision);
    for (var i = 0; i < relojes.length; i++) {
      var r = relojes[i];
      if (!emision) { r.textContent = ""; continue; }
      if (emision.alAire) { r.textContent = r.dataset.aire; continue; }
      var faltan = Math.max(0, emision.arranca - Date.now());
      var minutos = Math.floor(faltan / 60000);
      var dias = Math.floor(minutos / 1440);
      var horas = Math.floor((minutos % 1440) / 60);
      var partes = [];
      if (dias) { partes.push(dias + " " + r.dataset.dias); }
      if (dias || horas) { partes.push(horas + " " + r.dataset.horas); }
      partes.push((minutos % 60) + " " + r.dataset.minutos);
      r.textContent = r.dataset.faltan + " " + partes.join(" · ");
    }
  }

  pintarReloj();
  setInterval(pintarReloj, 30000);

  var spoiler = document.getElementById("spoilers-abre");
  if (spoiler) {
    if (leer(LLAVE_SPOILER) === "abierto") { spoiler.open = true; }
    spoiler.addEventListener("toggle", function () {
      guardar(LLAVE_SPOILER, spoiler.open ? "abierto" : "cerrado");
    });
  }
}());
</script>
</body>
</html>
