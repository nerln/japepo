name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "gui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # La pagina que se publica se vuelve a construir desde data/ y se compara con
  # la commiteada. Si alguien retoco un numero en el HTML, o subio datos nuevos
  # sin reconstruir, no sale nada. Son diecisiete comprobaciones, no una:
  # ver gui/verificar.py.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install --quiet numpy fonttools brotli pillow
      - run: python3 gui/verificar.py

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
