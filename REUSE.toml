version = 1
SPDX-PackageName = "japepo"
SPDX-PackageSupplier = "nerln <https://github.com/nerln>"
SPDX-PackageDownloadLocation = "https://github.com/nerln/japepo"

# JSON no admite comentarios, asi que las cabeceras SPDX de los datos viven aca.
[[annotations]]
path = ["data/**.json", "web/datos.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln"
SPDX-License-Identifier = "CC-BY-4.0"

# data/tuits.json guarda tres tuits ajenos palabra por palabra, con su autor y
# su enlace. Esos textos no son de nerln y no se relicencian: se citan.
[[annotations]]
path = ["data/tuits.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 nerln; los tuits citados son de sus autores (@_MasterChefPy, @sntparaguay)"
SPDX-License-Identifier = "CC-BY-4.0 AND NOASSERTION"

[[annotations]]
path = ["**.md", "CITATION.cff"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["gui/plantilla.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln"
SPDX-License-Identifier = "Apache-2.0"

# La pagina publicada lleva adentro las tres cosas: el armazon, la prosa y los
# datos, y las tres tipografias en base64. Declararla solo Apache-2.0 seria
# decir que las fuentes son de nerln.
[[annotations]]
path = ["web/index.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln; 2021 The Be Vietnam Pro Project Authors; 2014-2023 Adobe"
SPDX-License-Identifier = "Apache-2.0 AND CC-BY-4.0 AND OFL-1.1"

[[annotations]]
path = ["web/og.png", "web/icono.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln; 2021 The Be Vietnam Pro Project Authors"
SPDX-License-Identifier = "CC-BY-4.0 AND OFL-1.1"

# Las tipografias son de terceros: no llevan cabecera propia porque son binarios,
# y el aviso de cada una viaja adentro del archivo. Ver TERCEROS.md.
[[annotations]]
path = ["gui/tipos/BeVietnamPro-*.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2021 The Be Vietnam Pro Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["gui/tipos/SourceSerif4Variable.woff2", "gui/tipos/SourceCodeVariable.woff2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014-2023 Adobe"
SPDX-License-Identifier = "OFL-1.1"

# gui/fuentes.css se genera y lleva adentro las tres tipografias en base64.
[[annotations]]
path = ["gui/fuentes.css"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nerln; 2021 The Be Vietnam Pro Project Authors; 2014-2023 Adobe"
SPDX-License-Identifier = "Apache-2.0 AND OFL-1.1"

[[annotations]]
path = ["gui/tipos/OFL-*.txt", "LICENSE", "NOTICE", "web/.nojekyll"]
precedence = "aggregate"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "NOASSERTION"
